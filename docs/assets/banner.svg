<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Goblin Pawn Stars</title>
  <desc id="bannerDesc">A gold-on-dark-wood banner for the World of Warcraft: Forever addon Goblin Pawn Stars, release 1.4.0, The Deed.</desc>

  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0a06"/>
      <stop offset="0.42" stop-color="#24170e"/>
      <stop offset="0.72" stop-color="#1b110a"/>
      <stop offset="1" stop-color="#0b0704"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a1f"/>
      <stop offset="0.2" stop-color="#f3d488"/>
      <stop offset="0.42" stop-color="#c9973f"/>
      <stop offset="0.64" stop-color="#ffe9a8"/>
      <stop offset="0.84" stop-color="#b07c2c"/>
      <stop offset="1" stop-color="#7a4d18"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.45" stop-color="#e2b45a"/>
      <stop offset="1" stop-color="#b07c2c"/>
    </linearGradient>
    <linearGradient id="fadeGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9973f" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#c9973f" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#c9973f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coin" cx="34%" cy="26%" r="78%">
      <stop offset="0" stop-color="#fff2b8"/>
      <stop offset="0.45" stop-color="#e2b45a"/>
      <stop offset="0.8" stop-color="#c08a32"/>
      <stop offset="1" stop-color="#8a5a1f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="44%" r="76%">
      <stop offset="0.48" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
