    <ellipse cx="948" cy="182" rx="58" ry="4"/>
    <ellipse cx="640" cy="286" rx="72" ry="4.4"/>
  </g>

  <ellipse cx="168" cy="170" rx="320" ry="220" fill="url(#glow)"/>
  <rect width="1280" height="340" fill="url(#vignette)"/>

  <rect x="14.5" y="14.5" width="1251" height="311" rx="9" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.72"/>
