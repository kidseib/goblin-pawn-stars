  <rect width="1280" height="340" fill="url(#wood)"/>

  <g stroke="#f3c37a" stroke-width="1" opacity="0.045">
    <path d="M0 52 H1280"/>
    <path d="M0 104 H1280"/>
    <path d="M0 156 H1280"/>
    <path d="M0 208 H1280"/>
    <path d="M0 260 H1280"/>
    <path d="M0 312 H1280"/>
  </g>
  <g fill="none" stroke="#f3c37a" stroke-width="1" opacity="0.05">
