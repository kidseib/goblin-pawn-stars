    <circle r="63" fill="none" stroke="#fff2b8" stroke-width="1" opacity="0.28" stroke-dasharray="2 5"/>
    <path d="M -18 -40 C -4 -46 12 -40 20 -30 C 26 -22 26 -16 24 -12 L 50 2 C 55 6 54 13 48 15 L 34 17 C 30 18 28 20 26 23 C 23 28 18 34 14 43 L 14 50 L -22 50 C -22 40 -20 30 -20 22 C -30 14 -34 2 -34 -8 C -34 -22 -28 -34 -18 -40 Z" fill="#2b1909"/>
    <path d="M -24 -26 L -66 -48 L -40 -2 Z" fill="#2b1909"/>
    <path d="M 1 -18 Q 8 -24 16 -19 Q 8 -14 1 -18 Z" fill="#ffe9a8"/>
    <path d="M 18 23 Q 28 25 36 17" fill="none" stroke="#ffe0a0" stroke-width="2" opacity="0.85" stroke-linecap="round"/>
    <path d="M 27 21 L 31 21 L 29 27 Z" fill="#ffe9a8"/>
    <path d="M -32 -16 L -56 -38" fill="none" stroke="#7a4c17" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <circle cx="3" cy="-16" r="3.4" fill="#ffe9a8"/>
    <path d="M-56 -34 A 72 72 0 0 1 26 -62" fill="none" stroke="#fff6d0" stroke-width="2.4" opacity="0.4" stroke-linecap="round"/>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="272" y="94" fill="#b99a63" font-size="13px" font-weight="600" letter-spacing="5.5px">A WORLD OF WARCRAFT: FOREVER ADDON</text>
  </g>
  <text x="270" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="40px" letter-spacing="14px" fill="#d9bd83">GOBLIN</text>
  <text x="266" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="78px" font-weight="bold" letter-spacing="1px" fill="url(#goldText)">PAWN STARS</text>

  <path d="M272 246 H760" stroke="url(#fadeGold)" stroke-width="1.5"/>
  <path d="M272 242 L278 246 L272 250 L266 246 Z" fill="#c9973f"/>

  <text x="272" y="280" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22px" fill="#d8c39a">“I know what I’ve got.”</text>
  <text x="272" y="306" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13px" letter-spacing="1.7px" fill="#9c8560">STOCK IT · HAGGLE IT · PAY OFF THE CARTEL</text>

  <g transform="translate(1088 170)">
    <circle r="96" fill="#0d0805" opacity="0.5"/>
    <circle r="90" fill="#1a1109" stroke="url(#gold)" stroke-width="2.5"/>
    <circle r="80" fill="none" stroke="#c9973f" stroke-width="1" opacity="0.45"/>
    <circle r="60" fill="none" stroke="#c9973f" stroke-width="1" opacity="0.22" stroke-dasharray="2 5"/>
    <text y="-40" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11px" letter-spacing="4px" fill="#b99a63">RELEASE</text>
    <text y="18" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50px" font-weight="bold" fill="url(#goldText)">1.4.0</text>
    <path d="M-44 34 H44" stroke="#c9973f" stroke-width="1" opacity="0.45"/>
    <text y="56" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11px" letter-spacing="3px" fill="#d8c39a">THE DEED</text>
