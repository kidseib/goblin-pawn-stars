<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">The core loop — Loot it, stock it, haggle it</title>
  <desc id="d">A gold-on-dark-wood Goblin Pawn Stars banner showing the four-step shop loop.</desc>
  
