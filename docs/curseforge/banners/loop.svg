  <text x="64" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="bold" letter-spacing="0.4" fill="url(#goldText)">Loot it. Stock it.</text><text x="64" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="bold" letter-spacing="0.4" fill="url(#goldText)">Haggle it.</text>
  <text x="64" y="224" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#d8c39a">Every pickup becomes virtual stock. Every customer has a budget,</text><text x="64" y="247" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#d8c39a">a taste, and a hidden ceiling.</text>
