      <circle cx="50" cy="170" r="20" fill="#1b120a" stroke="#7faed6" stroke-width="1.4"/>
      <text x="50" y="174" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#7faed6">ET</text>
