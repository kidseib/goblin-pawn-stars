  <text x="64" y="58" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="4.4" fill="#b99a63">CUSTOMERS &amp; HAGGLING</text>
  <text x="64" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="bold" letter-spacing="0.4" fill="url(#goldText)">Everybody wants</text><text x="64" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="bold" letter-spacing="0.4" fill="url(#goldText)">a deal.</text>
  <text x="64" y="224" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#d8c39a">Nine archetypes, nine sets of tastes, budgets, patience and stubbornness.</text><text x="64" y="247" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#d8c39a">Rare collectors pay better — if you can read them.</text>
