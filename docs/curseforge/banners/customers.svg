      <text x="266" y="174" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#b68ad9">RH</text>
      <text x="294" y="168" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e6d3a8">Rare Hunter</text>
