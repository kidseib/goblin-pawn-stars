  <text x="64" y="58" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="4.4" fill="#b99a63">1.6.1 — THE DEED</text>
  <text x="64" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="bold" letter-spacing="0.4" fill="url(#goldText)">Three notes.</text><text x="64" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="bold" letter-spacing="0.4" fill="url(#goldText)">One way out.</text>
  <text x="64" y="224" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#d8c39a">A cartel debt with a finish line: 1,500 → 6,000 → 25,000 gc.</text><text x="64" y="247" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#d8c39a">Build the museum, keep Marta talking, then choose what comes next.</text>
