<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">The Deed — three notes, one way out</title>
  <desc id="d">A Goblin Pawn Stars banner showing the three cartel payments, museum and Marta rewards.</desc>
  
