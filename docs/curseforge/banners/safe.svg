<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Safe by design — no real gold, no real items</title>
  <desc id="d">A Goblin Pawn Stars banner listing the addon safety guarantees.</desc>
  
