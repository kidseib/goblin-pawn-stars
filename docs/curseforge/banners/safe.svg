  <text x="64" y="58" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="4.4" fill="#b99a63">SAFE BY DESIGN</text>
  <text x="64" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="bold" letter-spacing="0.4" fill="url(#goldText)">No real gold.</text><text x="64" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="bold" letter-spacing="0.4" fill="url(#goldText)">No real items.</text>
  <text x="64" y="224" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#d8c39a">Bags are read, never written. No auctions, no trades, no automation.</text><text x="64" y="247" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#d8c39a">No protected APIs, no network calls, no dependencies.</text>
