      <text x="164" y="182" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.8" fill="#e6d3a8">NO DEPENDENCIES</text>
      <text x="164" y="197" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#9c8560">Lua 5.1, no libraries</text>
    <text x="24" y="240" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5" letter-spacing="1.7" fill="#7f6a48">SAFE TO RUN ANYWHERE · NO RUNTIME AI · NO TELEMETRY</text>
  
