      <text x="164" y="121" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#9c8560">Bags are read-only</text>
      <circle cx="146" cy="140" r="7" fill="none" stroke="#5b8a45"/>
      <path d="M142 140 l3 3 5 -6" fill="none" stroke="#7fd36b" stroke-width="1.6" stroke-linecap="round"/>
      <text x="164" y="144" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.8" fill="#e6d3a8">NO GAME AUTOMATION</text>
