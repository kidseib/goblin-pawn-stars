name: Apply 1.8.0

# Temporary delivery job for the version roll. The changelog, README and PROGRESS are
# too large for the contents API, so a checked-in script applies the edit; the job
# requires the exact blob hashes the change was verified against, runs the full gate,
# commits, and deletes itself.

on:
  push:
    paths:
      - '.github/scripts/release-1.8.0.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nothing to do once the edit has landed
        id: guard
        run: |
          if [ -f .github/scripts/release-1.8.0.js ]; then
            echo "skip=0" >> "$GITHUB_OUTPUT"
          else
            echo "already applied"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip == '0'
        with:
          node-version: 20
          cache: npm

      - name: Apply the edits
        if: steps.guard.outputs.skip == '0'
        run: node .github/scripts/release-1.8.0.js

      - name: Require the exact bytes this change was verified against
        if: steps.guard.outputs.skip == '0'
        run: |
          set -eu
          fail=0
          check() {
            got=$(git hash-object "$1")
            if [ "$got" != "$2" ]; then
              echo "MISMATCH $1: got $got want $2"
              fail=1
            fi
          }
          check addon/GoblinPawnStars/GoblinPawnStars.toc 829186df56e8f17335c222010ee0c7c28e77c542
          check addon/GoblinPawnStars/Core/Bootstrap.lua 332e5b1242c5ebded9e97e3434d9b3d5dcdba2d7
          check package.json 7b0b13dededc73ae40f904a559fa128d8edb802d
          check CHANGELOG.md 456e36e136569d1f232df50015200dd1987f634b
          check README.md 24264d96da526e149f31c394e567166b77b81614
          check TESTING.md 22929a125dfc04227949f437fd9b51bf98373173
          check docs/curseforge/description.md 52f0e0d1855149661c8e08795ad9e15e887706d8
          check PROGRESS.md c887be355adcb4c10d1d17d90a89d2d2301b3f83
          exit "$fail"

      - name: Verify before committing
        if: steps.guard.outputs.skip == '0'
        run: |
          set -eu
          npm ci
          npm run verify

      - name: Commit and push
        if: steps.guard.outputs.skip == '0'
        run: |
          set -eu
          git config user.name 'Error.Seib'
          git config user.email 'kidseib@gmail.com'
          git rm -q .github/scripts/release-1.8.0.js .github/workflows/apply-1.8.0.yml
          git add -A
          git commit -m 'release: 1.8.0 -- the journal save fix changes the payload format'
          git log --oneline -1
          git diff --stat HEAD~1 HEAD
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
            git pull --rebase -q origin main
          done
          exit 1
