name: Apply the 1.7.0 source patch

# One-shot transport for the 1.7.0 release. The sandbox that produced the
# commit had no git credentials, so the source travels as a compressed patch;
# this workflow lands it on main and then deletes itself.

on:
  push:
    branches: [main]
    paths: [".release/chunk-00.b64"]

permissions:
  contents: write

jobs:
  apply:
    name: Apply and push
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the source patch
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          cat .release/chunk-*.b64 > /tmp/release/patch.b64
          base64 -d /tmp/release/patch.b64 > /tmp/release/patch.gz
          gunzip -c /tmp/release/patch.gz > /tmp/release/release.patch
          echo "patch bytes: $(wc -c < /tmp/release/release.patch)"
          git apply --check /tmp/release/release.patch
          git apply /tmp/release/release.patch
          rm -rf .release .github/workflows/apply-release-patch.yml
          git rm -r --ignore-unmatch --quiet dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: 1.7.0"
          git push origin HEAD:main
