name: iter5
on:
  push:
    paths:
      - '.github/workflows/iter5-deliver.yml'
      - '.github/scripts/iter5-*.b64'
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: test -f .github/scripts/iter5-d.b64 && echo "go=1" >> "$GITHUB_OUTPUT" || echo "go=0" >> "$GITHUB_OUTPUT"
      - if: steps.c.outputs.go == '1'
        run: |
          set -euo pipefail
          cat .github/scripts/iter5-a.b64 .github/scripts/iter5-b.b64 .github/scripts/iter5-c.b64 .github/scripts/iter5-d.b64 > /tmp/p.xz
          echo "c84f96e522881fd335c822de490f6e410ce255c245b22f971ab51844337509f9  /tmp/p.xz" | sha256sum -c -
          xz -dc /tmp/p.xz > /tmp/p.patch
          echo "0d02d15e76df8f47f22f6acd87bb9e9436aee98557f162a7dc7863a0cfd10302  /tmp/p.patch" | sha256sum -c -
          git apply --check /tmp/p.patch
          git apply /tmp/p.patch
      - if: steps.c.outputs.go == '1'
        run: |
          npm ci
          npm run check
          npm test
          node tools/sim_30min.js
          node tools/sim_campaign.js --hours 4 --seeds 4
      - if: steps.c.outputs.go == '1'
        run: |
          set -euo pipefail
          git config user.name "Error.Seib"
          git config user.email "kidseib@gmail.com"
          git add addon/GoblinPawnStars/Core/Persist.lua
          printf '%s\n' \
            "fix(save): keep patron status and order history through normalize" \
            "" \
            "The regulars rebuild in Persist.normalize wrote a fixed field list, so" \
            "patron, fulfilled and souredDay were dropped on every load: a patron" \
            "came back a stranger, deliveries reset and a soured regular forgot the" \
            "cooling-off day. Carry them additively and clamp them; a save without" \
            "the fields gains none of them. Orders keep their patron flag too." > /tmp/m1
          git commit -q -F /tmp/m1
          git add addon/GoblinPawnStars/Data/Regulars.lua addon/GoblinPawnStars/Modules/Regulars.lua addon/GoblinPawnStars/Modules/Customers.lua addon/GoblinPawnStars/Data/Dialogue.lua
          printf '%s\n' \
            "feat(regulars): make patron status a relationship with real terms" \
            "" \
            "Patrons bring a 3.2x budget instead of 2.6x, get one extra shop day," \
            "pay 1.5x market for the shelf they asked for and are worth 12" \
            "reputation and two goodwill visits per delivery. They also take 1.5x" \
            "the arrival weight, ask 75% of the time, hand over a bigger order the" \
            "moment they are promoted, and greet the shop in their own voice." > /tmp/m2
          git commit -q -F /tmp/m2
          git add addon/GoblinPawnStars/UI/MainFrame.lua addon/GoblinPawnStars/UI/Widgets.lua addon/GoblinPawnStars/UI/Tabs/Customers.lua
          printf '%s\n' \
            "feat(ui): announce pending orders and fit the wanted card" \
            "" \
            "A single title-bar chip names the shelf and the days left, turns red on" \
            "the last day and opens the Customers tab, so a deadline is visible" \
            "while stocking or buying wholesale. The WANTED TODAY card anchors its" \
            "bar to the card bottom and drops the daily buyer line before the order" \
            "line when the font does not fit, instead of growing out of the card." > /tmp/m3
          git commit -q -F /tmp/m3
          git add addon/GoblinPawnStars/Modules/Diagnostics.lua tools/smoke_ui.lua
          printf '%s\n' \
            "test: cover patron persistence, the patron premium and card fitting" \
            "" \
            "Three new headless tests (83 total) plus UI smoke assertions for the" \
            "title-bar chip and the anchored, bounded order card." > /tmp/m4
          git commit -q -F /tmp/m4
          git add CHANGELOG.md TODO.md PROGRESS.md README.md
          printf '%s\n' \
            "docs: iteration 5 changelog, roadmap and measured tuning" \
            "" \
            "Records the patron terms, the awareness chip, the save fix and the six-seed" \
            "on/off/ignored/patron-disabled probe numbers, plus what still needs a live" \
            "client." > /tmp/m5
          git commit -q -F /tmp/m5
          git rm -q .github/scripts/iter5-a.b64 .github/scripts/iter5-b.b64 .github/scripts/iter5-c.b64 .github/scripts/iter5-d.b64 .github/workflows/iter5-deliver.yml
          git commit -q -m "chore: remove iteration 5 delivery scaffolding"
          git status --short
          git push origin HEAD:refinement-polish
      - if: steps.c.outputs.go == '0'
        run: echo "already delivered"
