name: Iteration 7 delivery

# TEMPORARY scaffolding: applies the README line-count correction and pushes it.
# Removes itself in its final commit.

on:
  push:
    branches: [refinement-polish]
    paths:
      - ".github/scripts/iter7/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deliver or report
        run: bash .github/scripts/iter7/drive.sh
