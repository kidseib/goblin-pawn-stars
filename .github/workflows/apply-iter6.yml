name: Iteration 6 delivery

# TEMPORARY scaffolding. Applies the prepared iteration-6 patch, runs the full
# gate and commits the result in a small series. Removes itself and the parts in
# its final commit, so a push to the branch will not re-run it.

on:
  push:
    branches: [refinement-polish]
    paths:
      - ".github/scripts/iter6/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the parts are all present
        id: parts
        run: |
          if [ -f .github/scripts/iter6/p-10 ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "go=0" >> "$GITHUB_OUTPUT"
            echo "parts incomplete, nothing to do"
          fi

      - uses: actions/setup-node@v4
        if: steps.parts.outputs.go == '1'
        with:
          node-version: 20

      - name: Assemble and apply the patch
        if: steps.parts.outputs.go == '1'
        run: |
          set -euo pipefail
          cat .github/scripts/iter6/p-0* .github/scripts/iter6/p-10 > /tmp/iter6.patch.xz
          echo "076935bae60043046783ec4b05361907f4bec6d97413631a9a142fa00c2d9260  /tmp/iter6.patch.xz" | sha256sum -c -
          xz -dc /tmp/iter6.patch.xz > /tmp/iter6.patch
          echo "0bc41f0d722873b82715bf4724ebabab546b859d009babd8286e417eddc4b529  /tmp/iter6.patch" | sha256sum -c -
          git apply --check /tmp/iter6.patch
          git apply /tmp/iter6.patch
          git status --short

      - name: Gate
        if: steps.parts.outputs.go == '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check
          npm test
          node tools/sim_30min.js | tail -4
          node tools/sim_campaign.js --hours 4 --seeds 4 | tail -6

      - name: Commit and push
        if: steps.parts.outputs.go == '1'
        run: |
          set -euo pipefail
          git config user.name "kidseib"
          git config user.email "kidseib@users.noreply.github.com"

          git add addon tools
          git commit -q -m "feat: counter streak and milestone ceremony" \
            -m "Landed counters now fill a session-only streak meter in the negotiation title bar; five in a row arm one clean deal that pays 10% over the agreed price plus 2 reputation on the next landed counter, then resets. Crossing a reputation tier or completing a deed fires a one-second celebration and lights a permanent shop-standing pip in the sidebar, saved via shop.celebratedTier so a relog restores the visuals without replaying the fanfare." \
            -m "Both features hook events that already fire and add no timer, no OnUpdate and no per-frame work. Six new headless tests and new UI-smoke assertions cover the streak cycle, the perk cap, the botched-counter reset, the ceremony de-duplication and the reload path."

          git add CHANGELOG.md TODO.md PROGRESS.md README.md
          git commit -q -m "docs: roadmap, changelog and test notes for iteration 6" \
            -m "Folds the ten-feature plan into TODO.md as an ordered plan marked shipped vs remaining, and records the streak and ceremony design reasoning, the perk cap, the benchmark numbers and the known gaps in CHANGELOG.md, PROGRESS.md and README.md."

          git rm -r -q .github/scripts
          git rm -q .github/workflows/apply-iter6.yml
          git commit -q -m "chore: remove iteration 6 delivery scaffolding"

          git push origin HEAD:refinement-polish
