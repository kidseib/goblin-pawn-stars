name: Apply 1.6.2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Apply, verify and publish 1.6.2
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the queued patch
        run: |
          base64 -d fix.patch.b64 | gunzip > "$RUNNER_TEMP/fix.patch"
          git apply --check "$RUNNER_TEMP/fix.patch"
          git apply "$RUNNER_TEMP/fix.patch"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify and build
        run: |
          npm ci
          npm run verify
          npm run package
          sha256sum dist/GoblinPawnStars-1.6.2.zip | sed 's#dist/##' > dist/GoblinPawnStars-1.6.2.zip.sha256

      - name: Commit 1.6.2 and remove the helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q dist/GoblinPawnStars-1.6.1.zip
          git rm -q .github/workflows/apply-1.6.2.yml fix.patch.b64
          git add -A
          git commit -m "fix: restore macro-journal saves and ship 1.6.2"
          git push origin HEAD:main
