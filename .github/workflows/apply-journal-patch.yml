name: Apply the journal error-kind patch

# Temporary delivery job: the change touches a 100 KB test file, so it ships as a
# patch and this job applies it, runs the suite and only then commits it.
# The patch and this workflow are deleted in the commit it makes.

on:
  push:
    paths:
      - '.github/patches/*.patch'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply the patch
        run: |
          set -eu
          for patch in .github/patches/*.patch; do
            echo "applying $patch"
            git apply --verbose "$patch"
          done
          git status --porcelain

      - name: Verify before committing
        run: |
          set -eu
          npm ci
          npm run verify

      - name: Commit and push
        run: |
          set -eu
          git config user.name 'Error.Seib'
          git config user.email 'kidseib@gmail.com'
          git rm -q .github/patches/journal-error-kind.patch \
                     .github/workflows/apply-journal-patch.yml
          git add -A addon
          git commit -m 'journal: report whether a failed read or a failed write is the error'
          git log --oneline -1
          git diff --stat HEAD~1 HEAD
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
            git pull --rebase -q origin main
          done
          exit 1
