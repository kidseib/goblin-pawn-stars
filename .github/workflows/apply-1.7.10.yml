name: Apply 1.7.10

# Temporary delivery job. The changelog and README are too large for the contents
# API, so a checked-in script applies the version bump; the job requires the exact
# blob hashes the change was verified against, runs the full gate, commits, and
# deletes itself.

on:
  push:
    paths:
      - '.github/scripts/release-1.7.10.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Nothing to do once the edit has landed
        id: guard
        run: |
          if [ -f .github/scripts/release-1.7.10.js ]; then
            echo "skip=0" >> "$GITHUB_OUTPUT"
          else
            echo "already applied"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip == '0'
        with:
          node-version: 20
          cache: npm

      - name: Apply the edits
        if: steps.guard.outputs.skip == '0'
        run: node .github/scripts/release-1.7.10.js

      - name: Require the exact bytes this change was verified against
        if: steps.guard.outputs.skip == '0'
        run: |
          set -eu
          fail=0
          check() {
            got=$(git hash-object "$1")
            if [ "$got" != "$2" ]; then
              echo "MISMATCH $1: got $got want $2"
              fail=1
            fi
          }
          check addon/GoblinPawnStars/GoblinPawnStars.toc 2f7e97884d9662378574796777e533836245041b
          check addon/GoblinPawnStars/Core/Bootstrap.lua 5975390d84f043ba4b6df5c2288be089b7ee6f3b
          check package.json 4beea94206ae91c69863f310fc8dc7ad092b96de
          check CHANGELOG.md 8bb83645f1fe6baf63d5e2d7e86076d7b902cbd3
          check README.md da9715e60952863992025a7249eb88d49bd459d3
          check TESTING.md 4d1c3f2630d18e7a0a271d3e399bdfe0d3fbfed3
          check docs/curseforge/description.md 5c3a48f13da357b27c141172394a2e807fefe747
          exit "$fail"

      - name: Verify before committing
        if: steps.guard.outputs.skip == '0'
        run: |
          set -eu
          npm ci
          npm run verify

      - name: Commit and push
        if: steps.guard.outputs.skip == '0'
        run: |
          set -eu
          git config user.name 'Error.Seib'
          git config user.email 'kidseib@gmail.com'
          git rm -q .github/scripts/release-1.7.10.js \
                     .github/workflows/apply-1.7.10.yml
          git add -A
          git commit -m 'release: 1.7.10 -- journal save fix, version and docs'
          git log --oneline -1
          git diff --stat HEAD~1 HEAD
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
            git pull --rebase -q origin main
          done
          exit 1
