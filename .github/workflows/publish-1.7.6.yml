name: Publish 1.7.6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the verified release patch
        env:
          PATCH_URL: https://d.uguu.se/sqSJYDJeZDUS.patch
          PATCH_SHA256: fc957fe49a0d615d411f850c6cfcb424376d2f6afed4755eafca856dfae90529
        run: |
          curl -fsSL "$PATCH_URL" -o /tmp/release.patch
          echo "$PATCH_SHA256  /tmp/release.patch" | sha256sum -c -
          git apply --check /tmp/release.patch
          git apply /tmp/release.patch

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run syntax checks and tests
        run: npm run verify

      - name: Commit and push 1.7.6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release 1.7.6 with faster inventory sorting and profiling."
          git push origin HEAD:main

      - name: Build and checksum the release ZIP
        run: |
          version="$(sed -n 's/^## Version:[[:space:]]*//p' addon/GoblinPawnStars/GoblinPawnStars.toc)"
          test "$version" = "1.7.6"
          npm run package
          test -f dist/GoblinPawnStars-1.7.6.zip
          sha256sum dist/GoblinPawnStars-1.7.6.zip > dist/GoblinPawnStars-1.7.6.zip.sha256
          cat dist/GoblinPawnStars-1.7.6.zip.sha256

      - name: Extract the 1.7.6 patch notes
        run: |
          awk '/^## \[1.7.6\]/{found=1; next} /^## \[/{found=0} found' CHANGELOG.md \
            | sed '/^---$/d' > /tmp/notes.md
          test -s /tmp/notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          gh release create v1.7.6 \
            dist/GoblinPawnStars-1.7.6.zip \
            dist/GoblinPawnStars-1.7.6.zip.sha256 \
            --target "$sha" \
            --title "Goblin Pawn Stars 1.7.6" \
            --notes-file /tmp/notes.md \
            --latest

      - name: Remove the one-shot workflow
        run: |
          git rm .github/workflows/publish-1.7.6.yml
          git commit -m "chore: remove the one-shot 1.7.6 workflow"
          git push origin HEAD:main
