name: iter4
on:
  push:
    paths:
      - '.github/workflows/iter4-deliver.yml'
      - '.github/scripts/iter4-*.b64'
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: test -f .github/scripts/iter4-b.b64 && echo "go=1" >> "$GITHUB_OUTPUT" || echo "go=0" >> "$GITHUB_OUTPUT"
      - if: steps.c.outputs.go == '1'
        run: |
          set -euo pipefail
          cat .github/scripts/iter4-a.b64 .github/scripts/iter4-b.b64 > /tmp/p.xz
          echo "4bf16a021b23b79ecc268c8bd905e5de4cac04c5d319083e836b288840547cfa  /tmp/p.xz" | sha256sum -c -
          xz -dc /tmp/p.xz > /tmp/p.patch
          echo "d3ee30202e87ae8646531141904881557e795bb907de91f1900e46c28da8ec08  /tmp/p.patch" | sha256sum -c -
          git apply --check /tmp/p.patch
          git apply /tmp/p.patch
      - if: steps.c.outputs.go == '1'
        run: |
          npm ci
          npm run check
          npm test
          node tools/sim_30min.js
          node tools/sim_campaign.js --hours 4 --seeds 4
      - if: steps.c.outputs.go == '1'
        run: |
          set -euo pipefail
          git config user.name "Error.Seib"
          git config user.email "kidseib@gmail.com"
          git rm -q .github/scripts/iter4-a.b64 .github/scripts/iter4-b.b64 .github/workflows/iter4-deliver.yml
          git add -A
          git status --short | head -20
          printf '%s\n' \
            "refinement: special orders from regulars" \
            "" \
            "A remembered customer can come back wanting one shelf of goods, with a" \
            "named budget and a two-shop-day deadline. Delivering pays 1.35x live market" \
            "value inside that budget, adds reputation and goodwill, and two deliveries" \
            "make them a patron. Letting it lapse costs a little reputation and goodwill." \
            "Orders are capped at three, normalized additively in Persist, stripped from" \
            "journal snapshots and shown in the existing Customers tab. Five new tests" \
            "(80 total)." > /tmp/msg
          git commit -q -F /tmp/msg
          git push origin HEAD:refinement-polish
      - if: steps.c.outputs.go == '0'
        run: echo "delivered already"
