name: Release 1.6.1

on:
  push:
    paths:
      - .github/workflows/release-1.6.1.yml

permissions:
  contents: write

jobs:
  release:
    name: Build and publish 1.6.1
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply the 1.6.1 edits
        run: python3 tools/release_1_6_1.py

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Package
        run: npm run package

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -f dist/GoblinPawnStars-1.6.0.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -q tools/release_1_6_1.py
          git commit -m "Fix the minimap coin and release 1.6.1"
          git push origin HEAD:main

          SHA="$(sha256sum dist/GoblinPawnStars-1.6.1.zip | cut -d' ' -f1)"
          cat > /tmp/notes.md <<'NOTES'
          ### Fixed

          - The minimap button draws as a round coin again. The tracking border was anchored by its centre even though its art sits in the top-left of the texture, so the ring drifted off the coin and the icon spilled out of the frame. The button also had no round background behind the coin.
          - The waiting-customer alert is a small gold coin pip instead of an 8x8 green square that looked like a missing texture.

          Download `GoblinPawnStars-1.6.1.zip` from Assets.

          SHA-256: `__SHA__`

          No gameplay, save or economy changes.
          NOTES
          sed -i "s/__SHA__/$SHA/" /tmp/notes.md

          gh release create v1.6.1 dist/GoblinPawnStars-1.6.1.zip \
            --title "Goblin Pawn Stars 1.6.1 — Minimap Coin Fix" \
            --notes-file /tmp/notes.md \
            --target main
