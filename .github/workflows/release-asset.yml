name: Refresh v1.4.0 release asset

on:
  push:
    paths:
      - .github/workflows/release-asset.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace the packaged release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.4.0 dist/GoblinPawnStars-1.4.0.zip --clobber

      - name: Update the release download size and hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.4.0 --json body -q .body > /tmp/release-body.md
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/release-body.md')
          body = path.read_text()
          old = '**169 KB** · SHA-256 `bb639e184c76583ea7e50bf412f29c8139ba59b74a09c89fced78aeea2d2bc8f`'
          new = ('**2.99 MB** · SHA-256 `b493be01812857cb7e746a9e55d001d17eea200765106d7e99aba3d89419dfbc`'
                 '\n\nIncludes the eight 1440×900 UI renders in `docs/screenshots/`.')
          if old not in body:
              raise SystemExit('release body download line not found')
          path.write_text(body.replace(old, new, 1))
          PY
          gh release edit v1.4.0 --notes-file /tmp/release-body.md
